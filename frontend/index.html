<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5f7f2">
	<title>Daybook | Tasks</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

		:root {
			color-scheme: light;
			--ink: #1d2b25;
			--muted: #78847d;
			--line: #e5eae4;
			--paper: #ffffff;
			--canvas: #f5f7f2;
			--green: #2e745b;
			--green-dark: #235d49;
			--green-pale: #e7f2eb;
			--coral: #c76d56;
			--shadow: 0 18px 55px rgba(32, 57, 44, .07);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			background:
				radial-gradient(ellipse at 86% 4%, rgba(216, 232, 219, .55), transparent 34rem),
				var(--canvas);
			font-family: 'DM Sans', 'Segoe UI', sans-serif;
		}
		button, input { font: inherit; }
		button { cursor: pointer; }

		.app-shell { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 88px;
			border-bottom: 1px solid rgba(207, 218, 207, .7);
		}
		.brand { display: flex; align-items: center; gap: 11px; font-family: Manrope, sans-serif; font-size: 19px; font-weight: 800; }
		.brand-mark {
			display: grid;
			width: 34px;
			height: 34px;
			place-items: center;
			border-radius: 10px;
			color: white;
			background: var(--green);
		}
		.brand-mark svg { width: 19px; height: 19px; }
		.today-label { color: var(--muted); font-size: 13px; font-weight: 600; }

		main { padding: 54px 0 72px; }
		.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
		.eyebrow { margin: 0 0 9px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
		h1 { margin: 0; font-family: Manrope, sans-serif; font-size: clamp(30px, 4vw, 42px); font-weight: 700; letter-spacing: 0; line-height: 1.15; }
		.subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
		.completion-note { color: var(--muted); font-size: 13px; white-space: nowrap; }
		.completion-note strong { color: var(--ink); font-weight: 700; }

		.workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: start; gap: 36px; }
		.sidebar { padding-top: 6px; }
		.nav-label { margin: 0 0 12px 12px; color: #97a199; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
		.filter-list { display: grid; gap: 5px; }
		.filter-button {
			display: flex;
			width: 100%;
			align-items: center;
			justify-content: space-between;
			padding: 11px 12px;
			border: 0;
			border-radius: 7px;
			color: #66736b;
			background: transparent;
			text-align: left;
			transition: background .18s ease, color .18s ease;
		}
		.filter-button:hover { color: var(--ink); background: rgba(255,255,255,.7); }
		.filter-button[aria-pressed="true"] { color: var(--green-dark); background: var(--green-pale); font-weight: 700; }
		.filter-name { display: inline-flex; align-items: center; gap: 11px; }
		.filter-icon { display: grid; width: 17px; place-items: center; color: currentColor; }
		.filter-icon svg { width: 16px; height: 16px; }
		.filter-count { color: #8d9991; font-size: 12px; font-variant-numeric: tabular-nums; }
		.filter-button[aria-pressed="true"] .filter-count { color: var(--green); }
		.side-rule { height: 1px; margin: 23px 10px; background: var(--line); }
		.side-footnote { margin: 0 12px; color: #929d95; font-size: 12px; line-height: 1.7; }

		.task-panel { overflow: hidden; border: 1px solid #e8ece6; border-radius: 9px; background: var(--paper); box-shadow: var(--shadow); }
		.task-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid #edf0ec; }
		.task-panel-title { display: flex; align-items: center; gap: 10px; margin: 0; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 700; }
		.list-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
		.task-total { color: var(--muted); font-size: 12px; }
		.add-form { display: flex; gap: 10px; padding: 18px 24px; border-bottom: 1px solid #edf0ec; }
		.task-input-wrap { position: relative; flex: 1; }
		.input-plus { position: absolute; top: 50%; left: 13px; width: 17px; height: 17px; transform: translateY(-50%); color: #9aa69d; pointer-events: none; }
		.task-input {
			width: 100%;
			min-height: 44px;
			padding: 0 14px 0 40px;
			border: 1px solid #e2e8e1;
			border-radius: 6px;
			outline: none;
			color: var(--ink);
			background: #fcfdfb;
			font-size: 14px;
			transition: border-color .18s ease, box-shadow .18s ease;
		}
		.task-input::placeholder { color: #a1aaa3; }
		.task-input:focus { border-color: #7daa92; box-shadow: 0 0 0 3px rgba(46, 116, 91, .1); }
		.add-button {
			display: inline-flex;
			min-width: 103px;
			align-items: center;
			justify-content: center;
			gap: 8px;
			border: 0;
			border-radius: 6px;
			color: white;
			background: var(--green);
			font-size: 13px;
			font-weight: 700;
			transition: background .18s ease, transform .18s ease;
		}
		.add-button:hover { background: var(--green-dark); }
		.add-button:active { transform: translateY(1px); }
		.add-button svg { width: 16px; height: 16px; }
		.task-list { list-style: none; margin: 0; padding: 0 24px; }
		.task-item { display: flex; align-items: center; gap: 13px; min-height: 66px; border-bottom: 1px solid #f0f2ef; animation: appear .24s ease both; }
		.task-item:last-child { border-bottom: 0; }
		.check-button {
			display: grid;
			width: 20px;
			height: 20px;
			flex: 0 0 20px;
			place-items: center;
			padding: 0;
			border: 1.5px solid #c8d1c9;
			border-radius: 50%;
			color: white;
			background: white;
			transition: background .18s ease, border-color .18s ease, transform .18s ease;
		}
		.check-button:hover { border-color: var(--green); transform: scale(1.06); }
		.check-button[aria-pressed="true"] { border-color: var(--green); background: var(--green); }
		.check-button svg { width: 12px; height: 12px; opacity: 0; }
		.check-button[aria-pressed="true"] svg { opacity: 1; }
		.task-text { flex: 1; overflow-wrap: anywhere; color: #35433b; font-size: 14px; line-height: 1.5; }
		.task-item.is-complete .task-text { color: #9aa49c; text-decoration: line-through; text-decoration-color: #b6c0b8; }
		.delete-button {
			display: grid;
			width: 34px;
			height: 34px;
			flex: 0 0 34px;
			place-items: center;
			padding: 0;
			border: 0;
			border-radius: 5px;
			color: #9ba69e;
			background: transparent;
			opacity: 0;
			transition: color .18s ease, background .18s ease, opacity .18s ease;
		}
		.task-item:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
		.delete-button:hover { color: #b45442; background: #fff1ed; }
		.delete-button svg { width: 16px; height: 16px; }
		.empty-state { display: grid; min-height: 220px; align-content: center; justify-items: center; padding: 30px; text-align: center; }
		.empty-icon { display: grid; width: 42px; height: 42px; place-items: center; margin-bottom: 13px; border-radius: 50%; color: var(--green); background: var(--green-pale); }
		.empty-icon svg { width: 20px; height: 20px; }
		.empty-title { margin: 0; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 700; }
		.empty-copy { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
		.list-footer { min-height: 43px; padding: 13px 24px; border-top: 1px solid #edf0ec; color: #929d95; font-size: 11px; }
		.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
		@keyframes appear { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

		@media (max-width: 680px) {
			.app-shell { width: min(100% - 32px, 520px); }
			.topbar { min-height: 70px; }
			main { padding-top: 36px; }
			.page-heading { align-items: start; flex-direction: column; gap: 12px; margin-bottom: 23px; }
			.completion-note { align-self: flex-end; margin-top: -35px; }
			.workspace { grid-template-columns: 1fr; gap: 18px; }
			.sidebar { padding: 0; }
			.nav-label, .side-rule, .side-footnote { display: none; }
			.filter-list { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 1px; }
			.filter-button { width: auto; min-height: 39px; gap: 12px; padding: 8px 11px; border: 1px solid transparent; white-space: nowrap; }
			.filter-button[aria-pressed="true"] { border-color: #d3e5d7; }
			.filter-name { gap: 7px; }
			.task-panel-header { padding: 17px 17px; }
			.add-form { gap: 7px; padding: 14px 14px; }
			.add-button { min-width: 48px; width: 48px; font-size: 0; }
			.add-button svg { width: 18px; height: 18px; }
			.task-list { padding: 0 16px; }
			.task-item { min-height: 62px; gap: 11px; }
			.delete-button { opacity: 1; }
			.list-footer { padding-inline: 16px; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="m3 13 4 4L20 4"/></svg>
				</span>
				<span>daybook</span>
			</div>
			<div class="today-label" id="today-label"></div>
		</header>

		<main>
			<section class="page-heading" aria-labelledby="page-title">
				<div>
					<p class="eyebrow">A little more focus</p>
					<h1 id="page-title">Your tasks</h1>
					<p class="subtitle">Make room for what matters today.</p>
				</div>
				<div class="completion-note" id="completion-note" aria-live="polite"></div>
			</section>

			<div class="workspace">
				<aside class="sidebar" aria-label="Task filters">
					<p class="nav-label">View</p>
					<nav class="filter-list" id="filter-list">
						<button class="filter-button" type="button" data-filter="all" aria-pressed="true">
							<span class="filter-name"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h12M4 10h12M4 15h12"/></svg></span>All tasks</span>
							<span class="filter-count" data-count="all">0</span>
						</button>
						<button class="filter-button" type="button" data-filter="active" aria-pressed="false">
							<span class="filter-name"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="6.5"/></svg></span>To do</span>
							<span class="filter-count" data-count="active">0</span>
						</button>
						<button class="filter-button" type="button" data-filter="completed" aria-pressed="false">
							<span class="filter-name"><span class="filter-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4 10 4 4 8-8"/></svg></span>Completed</span>
							<span class="filter-count" data-count="completed">0</span>
						</button>
					</nav>
					<div class="side-rule"></div>
					<p class="side-footnote">Small steps add up. Keep your list simple and your next move clear.</p>
				</aside>

				<section class="task-panel" aria-labelledby="list-title">
					<header class="task-panel-header">
						<h2 class="task-panel-title" id="list-title"><span class="list-indicator" aria-hidden="true"></span><span id="list-heading">All tasks</span></h2>
						<span class="task-total" id="task-total">0 tasks</span>
					</header>
					<form class="add-form" id="task-form">
						<label class="sr-only" for="task-input">New task</label>
						<div class="task-input-wrap">
							<svg class="input-plus" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
							<input class="task-input" id="task-input" name="task" type="text" placeholder="What needs to get done?" maxlength="180" autocomplete="off" required>
						</div>
						<button class="add-button" type="submit"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span>Add task</span></button>
					</form>
					<ul class="task-list" id="task-list" aria-label="Tasks"></ul>
					<div class="list-footer" id="list-footer"></div>
				</section>
			</div>
		</main>
	</div>

	<script>
		const storageKey = 'daybook.tasks.v1';
		const taskForm = document.querySelector('#task-form');
		const taskInput = document.querySelector('#task-input');
		const taskList = document.querySelector('#task-list');
		const listHeading = document.querySelector('#list-heading');
		const taskTotal = document.querySelector('#task-total');
		const listFooter = document.querySelector('#list-footer');
		const completionNote = document.querySelector('#completion-note');
		const filterButtons = [...document.querySelectorAll('[data-filter]')];
		let activeFilter = 'all';
		let tasks = loadTasks();

		function loadTasks() {
			try {
				const savedTasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
				return Array.isArray(savedTasks)
					? savedTasks.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string' && typeof task.completed === 'boolean')
					: [];
			} catch {
				return [];
			}
		}

		function saveTasks() {
			try {
				localStorage.setItem(storageKey, JSON.stringify(tasks));
			} catch {
				listFooter.textContent = 'Changes will not be saved in this browser session.';
			}
		}

		function formatToday() {
			return new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'long', day: 'numeric' }).format(new Date());
		}

		function createIcon(markup) {
			const wrapper = document.createElement('span');
			wrapper.innerHTML = markup;
			return wrapper.firstElementChild;
		}

		function render() {
			const activeCount = tasks.filter(task => !task.completed).length;
			const completedCount = tasks.length - activeCount;
			const visibleTasks = tasks.filter(task => activeFilter === 'all' || (activeFilter === 'active' ? !task.completed : task.completed));

			document.querySelector('[data-count="all"]').textContent = tasks.length;
			document.querySelector('[data-count="active"]').textContent = activeCount;
			document.querySelector('[data-count="completed"]').textContent = completedCount;
			completionNote.innerHTML = `<strong>${completedCount}</strong> of <strong>${tasks.length}</strong> completed`;
			taskTotal.textContent = `${visibleTasks.length} ${visibleTasks.length === 1 ? 'task' : 'tasks'}`;
			listHeading.textContent = activeFilter === 'active' ? 'To do' : activeFilter === 'completed' ? 'Completed' : 'All tasks';
			listFooter.textContent = tasks.length ? `${activeCount} ${activeCount === 1 ? 'task' : 'tasks'} left to do` : 'Your list is ready when you are.';
			taskList.replaceChildren();

			if (!visibleTasks.length) {
				const empty = document.createElement('li');
				empty.className = 'empty-state';
				const emptyIcon = document.createElement('span');
				emptyIcon.className = 'empty-icon';
				emptyIcon.setAttribute('aria-hidden', 'true');
				emptyIcon.append(createIcon('<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m4 10 4 4 8-8"/></svg>'));
				const title = document.createElement('p');
				title.className = 'empty-title';
				title.textContent = activeFilter === 'completed' ? 'Nothing completed yet' : activeFilter === 'active' ? 'You’re all caught up' : 'A clear start';
				const copy = document.createElement('p');
				copy.className = 'empty-copy';
				copy.textContent = activeFilter === 'completed' ? 'Finished tasks will show up here.' : activeFilter === 'active' ? 'There are no tasks waiting for you.' : 'Add a task above to get going.';
				empty.append(emptyIcon, title, copy);
				taskList.append(empty);
				return;
			}

			for (const task of visibleTasks) {
				const item = document.createElement('li');
				item.className = `task-item${task.completed ? ' is-complete' : ''}`;

				const checkButton = document.createElement('button');
				checkButton.className = 'check-button';
				checkButton.type = 'button';
				checkButton.setAttribute('aria-label', task.completed ? `Mark ${task.text} as to do` : `Complete ${task.text}`);
				checkButton.setAttribute('aria-pressed', String(task.completed));
				checkButton.append(createIcon('<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8 3.2 3.2L13 4.5"/></svg>'));
				checkButton.addEventListener('click', () => {
					task.completed = !task.completed;
					saveTasks();
					render();
				});

				const text = document.createElement('span');
				text.className = 'task-text';
				text.textContent = task.text;

				const deleteButton = document.createElement('button');
				deleteButton.className = 'delete-button';
				deleteButton.type = 'button';
				deleteButton.setAttribute('aria-label', `Delete ${task.text}`);
				deleteButton.title = 'Delete task';
				deleteButton.append(createIcon('<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h12M8 6V4h4v2m-6 0 1 10h6l1-10"/></svg>'));
				deleteButton.addEventListener('click', () => {
					tasks = tasks.filter(item => item.id !== task.id);
					saveTasks();
					render();
				});

				item.append(checkButton, text, deleteButton);
				taskList.append(item);
			}
		}

		taskForm.addEventListener('submit', event => {
			event.preventDefault();
			const text = taskInput.value.trim();
			if (!text) {
				taskInput.focus();
				return;
			}
			tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
			saveTasks();
			activeFilter = 'all';
			filterButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.filter === activeFilter)));
			taskInput.value = '';
			render();
			taskInput.focus();
		});

		filterButtons.forEach(button => {
			button.addEventListener('click', () => {
				activeFilter = button.dataset.filter;
				filterButtons.forEach(filter => filter.setAttribute('aria-pressed', String(filter === button)));
				render();
			});
		});

		document.querySelector('#today-label').textContent = formatToday();
		render();
	</script>
</body>
</html>
